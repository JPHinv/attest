name: CI

# Draait de bouw-checks op elke PR naar main en op pushes naar main, zodat
# pull requests daadwerkelijke status-checks krijgen. Zonder workflow rapporteert
# de orchestrator "no checks" als CI-failure (fail-closed).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm run build` voert tijdens next build ook de type-validatie uit en
      # bewijst dat de SSG-pagina's renderen. Lint is bewust niet opgenomen:
      # het fundament configureert (nog) geen ESLint, dus `next lint` is
      # interactief en hoort niet in CI.
      - name: Build
        run: npm run build
